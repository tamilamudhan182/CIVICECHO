# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=civic-echo-backend

# H2 Database Configuration (In-Memory Database)
spring.datasource.url=jdbc:h2:mem:civicechodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console Access (Enabled for Debugging & Verification)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
